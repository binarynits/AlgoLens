name: iOS Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-flight runs if a new commit lands on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run fastlane test
    runs-on: macos-15
    timeout-minutes: 35

    env:
      # AlgoLens uses Xcode 26 SDK locally. The GitHub-hosted macos-15 runner
      # ships Xcode 16.x. If/when the runner gets Xcode 26, switch this to "26.0"
      # (or whatever stable label matches). See:
      # https://github.com/actions/runner-images/blob/main/images/macos/macos-15-Readme.md
      XCODE_VERSION: "latest-stable"
      # iPhone 17 Pro is the default in the Fastfile but the runner may not have it.
      # Pick a simulator that ships with whatever Xcode is installed on the runner.
      FASTLANE_TEST_DEVICE: "iPhone 16 Pro"
      FASTLANE_HIDE_CHANGELOG: "true"
      FASTLANE_DISABLE_COLORS: "1"
      LC_ALL: "en_US.UTF-8"
      LANG: "en_US.UTF-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Set up Ruby + Bundler cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Show toolchain versions
        run: |
          ruby --version
          bundle --version
          xcodebuild -version
          xcrun simctl list devices available | grep -E "iPhone " | head -10 || true

      - name: Run fastlane test
        run: bundle exec fastlane test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastlane-test-output
          path: fastlane/test_output/
          if-no-files-found: ignore
